    result: "Both families resolve. GET_HW and LIST_CALIBRATIONS return ENOTSUP. Vendor build restricts these commands."
    verdict: partial

  - id: E011
    script: tools/parse_calibration.py
    date: 2026-05-19
    name: "Calibration data extraction"
    purpose: "Parse vendor UWB calibration from /vendor/etc/uwb/UWB-calibration.conf"
    result: |
      Extracted: 4 antennas (2 ports, GPIO-switched), per-channel/PRF antenna delays
      (16409-16465 ticks ~257ns), TX power configs, PDoA LUTs for ant1-ant2 and ant1-ant3
      pairs (31 entries each, ±90deg range), xtal_trim=23, temperature_ref=85C,
      CCC v3 config, WiFi coex params. Factory xtal_trim=0x27 (39) differs from vendor config.
    verdict: success

  - id: E012
    date: 2026-05-19
    name: "Android UWB shell ranging session"
    purpose: "Start FiRa ranging via 'cmd uwb start-fira-ranging-session' with diagnostics enabled"
    result: |
      MAJOR BREAKTHROUGH: Session starts successfully via Android shell. Ranging reports
      flow at configured interval. UCI diagnostic notifications (ParsedDiagnosticNtfPacket)
      received via logcat with 3 FrameReports per round (RCM TX, RCPU TX, RIM RX).
      DiagramsFrameReportsFieldsFlags=7 (RSSI+AoA+CIR). CIR array is empty because no
      responder exists (RX timeout). With a second UWB device, CIR data would populate.
      Power stats confirm chip activity: 16ms TX, 10.2s RX, 268 wakes.
    verdict: success
    notes: |
      Key command: cmd uwb start-fira-ranging-session -b -i <id> -c 9 -t controller
        -r initiator -a <addr> -d <dest> -u ss-twr -l <interval_ms> -R enabled
      Enable diagnostics first: cmd uwb enable-diagnostics-notification -c -r -a
      Logcat filter: adb logcat | grep 'uwb_core::uci::notification'


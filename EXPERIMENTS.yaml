      (step 1) kills the HAL's FiRa session, triggering deep sleep. The mcps802154_reschedule
      path doesn't restart the chip: start_stop_request is false after scheduler replacement.
      Attempted running PCTT while FiRa active (fira+pctt regions), but SET_SCHEDULER_REGIONS
      replacing regions under active session caused kernel crash + reboot.
    verdict: partial
    notes: |
      Key finding: rmmod works under specific conditions (setenforce 0, HAL stopped, refcount 0).
      Magisk overlay does NOT work for kernel modules (loaded before overlays applied).
      Next: binary-patch dw3000.ko ISR to read CIR accumulator on RXPTO instead of
      trying to keep PCTT and FiRa coexisting.

  - id: E019
    date: 2026-05-19
    name: "dw3000.ko RXPTO ISR analysis for CIR hook"
    purpose: "Analyze vendor dw3000.ko binary to find patch point for CIR read on RXPTO"
    result: |
      Disassembled dw3000_isr_handle_rxto_event (0x105f8-0x106d8, 224 bytes).
      Handler: spin_lock -> check state -> power_stats -> increment rx_timeout_count
      -> bl mcps802154_rx_timeout (at 0x1068c) -> spin_unlock -> return.
      No call to dw3000_read_frame_cir_data or CIR-related functions.
      CIR read is only called from dw3000_isr_handle_rx_call_handler (0x12d74)
      which is reached via dw3000_isr_handle_rxfcg_event (successful frame RX).
      Binary patching requires trampoline (4 instructions for CIR call setup),
      but only 1 instruction of dead code available (BRK at 0x106d4).
      Alternative: redirect mcps802154_rx_timeout relocation to mcps802154_rx_frame
      but would crash due to missing frame setup. Concluded that ISR binary
      patching without source rebuild is impractical.
    verdict: dead_end
    notes: |
      Key symbols: dw3000_isr (0xfc1c), rxto_event (0x105f8), rxfcg_event (0x10360),
      rx_call_handler (0x12d74), read_frame_cir_data (0xda10), read_cir_data (0xdf68).
      The correct fix requires rebuilding dw3000.ko from source against the running
      kernel (commit ec45f20f38ea, 6.1.145) or disabling dm-verity to replace the
      vendor module with a source-patched version.

  - id: E020
    date: 2026-05-19
    name: "Binary-patch vendor dw3000.ko: CIR read on RXPTO via trampoline"
    purpose: "Redirect RXPTO handler to trampoline at dw3000_spitests that calls dw3000_read_frame_cir_data"
    result: |
      Applied 3 binary patches to vendor dw3000.ko:
      (1) At .text+0x10678: b.cs -> B to trampoline (0x14000324)
      (2) At .text+0x11308: 8-instruction trampoline in dw3000_spitests space:
          cmp/b.cs (error check), mov x0-x2 (args), bl dw3000_read_frame_cir_data
          (relative offset to 0xda10), b back to 0x1067c, brk
      (3) At .text+0xda98: tbnz (CIA flag check) -> B (unconditional, bypass CIA)
      Module loaded successfully via hot-swap. FiRa session runs (power=1).
      CIR data still not captured: debugfs cir_data returns I/O error.
      Cannot verify trampoline execution (kptr_restrict blocks address lookup,
      ftrace event enable blocked by permissions). The trampoline might execute
      but read_frame_cir_data could fail silently due to chip state during RXPTO
      (CIA registers may not be readable, SPI access may conflict).
    verdict: partial
    notes: |
      Trampoline technique is sound (ToF project used similar binary patches).
      Verification blocked by Android security restrictions (kptr_restrict,
      ftrace permissions). Need either: (a) source-built module for proper
      debugging, or (b) root shell with full CAP_SYS_ADMIN for ftrace access.

  - id: E021
    date: 2026-05-19
    name: "BREAKTHROUGH: CIR noise floor captured without second device"
    purpose: "Add debugfs state check bypass (patch 4) to allow CIR read during deep sleep"
    result: |
      Added 4th binary patch: bypass debugfs operational state check in
      dw3000_dbgfs_reg_op (b.hi -> b at 0x17ec8). This was the final blocker:
      the debugfs wrapper returned -EIO before reaching the cir_data handler
      because current_operational_state < DW3000_OP_STATE_IDLE_RC during deep
      sleep between FiRa ranging slots.

      With all 4 patches, cir_reader successfully captures 176 bytes of CIR I/Q
      data on every RXPTO during a FiRa session. 5 consecutive captures confirmed
      with incrementing timestamps. Data shows noise floor: 20 I/Q samples with
      magnitudes 0.1-0.56, random phases (no coherent signal), peak/mean ratio 1.7x.

      The complete 4-patch recipe:
      (1) RXPTO handler B redirect to trampoline at dw3000_spitests (0x10678)
      (2) 8-instruction trampoline: cmp/b.cs + mov args + bl read_frame_cir_data
          + b back (0x11308)
      (3) CIA flag check bypass: tbnz -> b in read_frame_cir_data (0xda98)
      (4) debugfs state check bypass: b.hi -> b in reg_op (0x17ec8)
    verdict: success
    notes: |
      All 4 patches are to vendor dw3000.ko at file offsets relative to .text
      section start (0x109fc). Hot-swap via: setenforce 0, stop HAL, rmmod chain
      (pctt, nfcc, fira, dw3000), insmod patched, insmod regions, start HAL.

  - id: E022
    script: tools/analyze_baseline.py
    date: 2026-05-19
    name: "CIR baseline statistical analysis"
    purpose: "Characterize 31-frame 64-bin CIR capture: classify elevated bins as artifacts vs. reflections"
    result: |
      31 frames at 50ms FiRa interval (16.7fps), 66 CIR bins per frame.
      SNR = 6.5 dB (vs 20-30 dB for real UWB signal), confirming RXPTO CIR
      is accumulator artifacts, not real frame reception.

      Key findings:
      - 18/64 bins have CoV < 0.05 (near-constant across frames), confirming
        stale CIR RAM content, not thermal noise or real reflections
      - Bins 40, 42, 48, 50, 52: CoV = 0.000-0.003 (essentially constant)
      - 4 stable elevated bins: bin 8 (mean=0.545, CoV=0.023, 4.8m),
        bin 10 (mean=0.564, CoV=0.007, 6.0m), bin 53 (mean=0.544, CoV=0.101, 31.8m),
        bin 58 (mean=0.612, CoV=0.062, 34.8m)
      - Bin 58 wins peak in 18/31 (58%) frames
      - Cross-correlation between elevated bins is low (|r| < 0.3), ruling out
        systematic gain pattern (bins are independently elevated)
      - CIRProcessor leading-edge detection jumps wildly (0-35m) with no consistent
        first path, confirming no coherent signal

      UPDATED after phase analysis (cir_phase_analysis.py) and noise
      characterization (cir_noise_characterize.py):
      - CIR data IS real receiver thermal noise, NOT stale RAM
      - Phase distribution is uniform (chi-squared 9.4, Rayleigh sigma ratio 1.049)
      - Spatial and temporal correlations near zero (white noise)
      - 20/21 bins have varying I/Q across captures (only bin 20 = constant zero)
      - The "stable" bins (CoV < 0.05) have hardware DC bias dominating noise
    verdict: success
    notes: |
      Data: data/cir_captures/baseline_50ms_64bins_mags.csv (31x66 magnitudes)
      Analysis: data/cir_captures/baseline_analysis.csv (per-bin stats)
      Detection thresholds: 3-sigma=0.760, 5-sigma=1.035, CFAR-10dB=1.097

  - id: E023
    script: tools/uwb_link_budget.py
    date: 2026-05-19
    name: "Monostatic radar impossibility analysis"
    purpose: "Determine if metal reflectors can produce CIR peaks without a second device"
    result: |
      MONOSTATIC RADAR IS NOT POSSIBLE with DW3000 in FiRa mode.

      TX-to-RX turnaround time is minimum 2us (hardware switching),
      typically 200-500us (FiRa protocol timing). At 2us turnaround,
      reflections from objects closer than 300m arrive BEFORE the RX
      window opens. ALL indoor reflections are in the TX-to-RX dead zone.

      This is a fundamental limitation of half-duplex UWB transceivers:
      the chip is either transmitting or receiving, never both. The DW3000
      has a single antenna path, no separate TX/RX chains for simultaneous
      operation.

      The CIR data captured during RXPTO is real receiver thermal noise
      (confirmed by Rayleigh distribution, uniform phase, white noise).
      No amount of reflector placement or signal processing can produce
      a reflection peak, because the reflected signal physically arrives
      during the dead zone and is never sampled.
    verdict: dead_end
    notes: |
      Link budget shows: 10cm foil at 1m gives +28 dB SNR IF monostatic
      were possible. The signal strength is not the issue; the timing is.
      A second UWB device is required for any CIR signal measurement.

  # Session 4b: Alternative Paths (2026-05-19)

  - id: E024
    script: tools/pctt_inject.c
    date: 2026-05-19
    name: "MCPS802154 testmode via netlink command 12"
    purpose: "Try testmode commands (RX_DIAG, CW_TONE, CONTINUOUS_TX) via mcps802154 CMD_TESTMODE instead of PCTT region"
    result: |
      AOSP Kbuild analysis: dw3000_testmode.o is conditionally compiled
      (dw3000-$(CONFIG_MCPS802154_TESTMODE) += dw3000_testmode.o).
      CONFIG_MCPS802154_TESTMODE is disabled in vendor build, so the
      testmode handler dw3000_tm_cmd is NOT linked into the vendor
      dw3000.ko. CMD_TESTMODE will return EOPNOTSUPP.

      NOTE: the .c file itself has no #ifdef guards (compiles cleanly),
      so rebuilding with CONFIG_MCPS802154_TESTMODE=y would enable it.
    verdict: dead_end
    notes: |
      Verified via AOSP: dw3000_testmode.c is unconditionally compilable
      but conditionally linked. Fast commands (DW3000_CMD_RX=0x2) cannot
      be issued through debugfs register writes (different SPI format).
      The dw3000_write_fastcmd function uses a special SPI transaction,
      not a register address write.
      Also prepared: dw3000_explore_regs.sh, dw3000_binary_search.sh.

      CRITICAL SUBTLETY: testmode START_RX_DIAG calls rx_enable with
      timeout_pac=0 (infinite RX, no RXPTO). Our trampoline (patches 1-2)
      only fires on RXPTO, so it would NEVER execute in testmode RX.
      CIR data would only flow if ambient UWB triggers rxfcg_event.
      Fix: read CIR accumulator directly via debugfs during continuous RX,
      or patch testmode to use timeout_pac>0 for periodic RXPTO events.
      Pipeline for source rebuild: tools/build_testmode.sh.

  - id: E025
    script: tools/dw3000_regwrite.sh
    date: 2026-05-19
    name: "DW3000 register write via debugfs for CW tone"
    purpose: "Write to DW3000 registers via debugfs to enable CW tone or modify TX-to-RX timing"
    result: "pending -- requires on-device testing"
    verdict: pending
    notes: |
      CRITICAL FINDING from AOSP source analysis (dw3000_debugfs.c):
      Debugfs register files are READ-WRITE by default (S_IRUGO | S_IWUGO).
      Only DW3000_CHIPREG_RO (flag=2) registers are read-only.
      DW3000_CHIPREG_WP (flag=4) registers are writable when chip is inactive.

      Register flag definitions (from dw3000_chip.h):
        DUMP=1 (dump only, fileid addressing)
        RO=2   (always read-only)
        WP=4   (write-protected when active)
        PERM=8 (accessible when chip is off)

      Key writable registers:
        TX_TEST (0x70028): TX test mode control
          Bit 0: TX_ENTEST (enable TX test)
          Bits 3:1: TX_TESTCODE (0=CW tone)
          Write 0x01 to enable CW tone
        ACK_RESP_T (0x36): TX-to-RX delay control
        SYS_CFG (0x10): system configuration (WP)
        CLK_CTRL (0x110004): clock enables

      CW tone physics note: CW tone is a single-frequency sinusoid, which
      is approximately orthogonal to the PN preamble code. Correlator output
      with CW input is proportional to the code's DC imbalance (typically
      5-15% of code energy). CW tone is useful as a DIAGNOSTIC (confirms
      register writes and RX path), but won't produce sharp CIR peaks.
      Also: CW is OFF during RX window (half-duplex), so antenna coupling
      only matters for residual ringing.

      cir_config (CONFIRMED from AOSP, highest value):
      Virtual register accepts "count N filter 0xX offset Y".
      No maximum count enforced (validates count >= 1).
      DW3000 accumulator has 1016 taps. Can expand from default 20 to 1016.
      cir_config has PERM flag (accessible anytime, even chip off).

      Tools prepared:
        dw3000_regwrite.sh: test-write, cw-on, cw-off, read, write, cir-expand
        dw3000_explore_regs.sh: full register survey
        dw3000_binary_search.sh: binary symbol analysis
        uwb_autonomous.sh: unattended capture with CIR expansion
        analyze_capture.sh: one-command post-capture analysis pipeline

